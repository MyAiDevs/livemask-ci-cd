# TASK-CICD-DEV-RUNTIME-AUTO-DEPLOY-001
#
# Reusable workflow for runtime repos to request a staging dev runtime rebuild
# after any push to dev.
#
# Usage (in a runtime repo workflow):
#
#   trigger-dev-runtime-deploy:
#     needs: [build]
#     if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
#     uses: MyAiDevs/livemask-ci-cd/.github/workflows/reusable-trigger-dev-runtime-deploy.yml@dev
#     secrets:
#       LIVEMASK_BOT_TOKEN: ${{ secrets.LIVEMASK_BOT_TOKEN }}

name: Reusable Trigger Dev Runtime Deploy

on:
  workflow_call:
    inputs:
      service:
        description: "Override service to deploy. Defaults to source repository mapping."
        required: false
        type: string
        default: ""
    secrets:
      LIVEMASK_BOT_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on:
      group: livemask-ci
      labels: [self-hosted, linux, livemask, docker, ci]
    steps:
      - name: Dispatch dev runtime deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.LIVEMASK_BOT_TOKEN }}
          repository: MyAiDevs/livemask-ci-cd
          event-type: dev-runtime-deploy
          client-payload: >-
            {
              "source_repo": "${{ github.repository }}",
              "service": "${{ inputs.service || (github.repository == 'MyAiDevs/livemask-backend' && 'backend' || github.repository == 'MyAiDevs/livemask-admin' && 'admin' || github.repository == 'MyAiDevs/livemask-website' && 'website' || github.repository == 'MyAiDevs/livemask-job-service' && 'job-service' || github.repository == 'MyAiDevs/livemask-nodeagent' && 'nodeagent' || 'status-only') }}",
              "ref": "${{ github.ref_name }}",
              "sha": "${{ github.sha }}",
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}"
            }
