# TASK-CICD-DEV-RUNTIME-AUTO-DEPLOY-001
#
# Reusable workflow for runtime repos to request a staging dev runtime rebuild
# after a successful push to dev.
#
# Usage (in a runtime repo workflow):
#
#   trigger-dev-runtime-deploy:
#     needs: [build]
#     if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.build.result == 'success'
#     uses: MyAiDevs/livemask-ci-cd/.github/workflows/reusable-trigger-dev-runtime-deploy.yml@dev
#     secrets:
#       LIVEMASK_BOT_TOKEN: ${{ secrets.LIVEMASK_BOT_TOKEN }}

name: Reusable Trigger Dev Runtime Deploy

on:
  workflow_call:
    secrets:
      LIVEMASK_BOT_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch dev runtime deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.LIVEMASK_BOT_TOKEN }}
          repository: MyAiDevs/livemask-ci-cd
          event-type: dev-runtime-deploy
          client-payload: >-
            {
              "source_repo": "${{ github.repository }}",
              "ref": "${{ github.ref_name }}",
              "sha": "${{ github.sha }}",
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}"
            }
