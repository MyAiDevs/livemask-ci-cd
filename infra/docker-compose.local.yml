name: livemask-local

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livemask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livemask}
      POSTGRES_DB: ${POSTGRES_DB:-livemask}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-livemask}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - livemask-local-postgres:/var/lib/postgresql/data

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    image: ${BACKEND_GO_IMAGE:-golang:1.25-alpine}
    working_dir: /workspace/livemask-backend
    restart: unless-stopped
    command: ["sh", "-lc", "${BACKEND_COMMAND:-/usr/local/go/bin/go run .}"]
    environment:
      PORT: "8080"
      DB_DSN: "${DB_DSN:-postgres://${POSTGRES_USER:-livemask}:${POSTGRES_PASSWORD:-livemask}@postgres:5432/${POSTGRES_DB:-livemask}?sslmode=disable}"
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
      VERSION: "${BACKEND_VERSION:-dev-local}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-key-do-not-use-in-production-32chr}"
      NODEAGENT_BACKEND_TLS_PORT: "${NODEAGENT_BACKEND_TLS_PORT:-8443}"
      NODEAGENT_BACKEND_TLS_CERT_PATH: "${NODEAGENT_BACKEND_TLS_CERT_PATH:-data/cert/backend.cert.pem}"
      NODEAGENT_BACKEND_TLS_KEY_PATH: "${NODEAGENT_BACKEND_TLS_KEY_PATH:-data/cert/backend.key.pem}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:3003,http://localhost:3001,http://localhost:3002,http://localhost:3003}"
      # GeoIP credential encryption. Leave empty unless an operator explicitly
      # provides a runtime secret; Backend fails closed before storing/decrypting
      # GeoIP source credentials when this is unset.
      GEOIP_CREDENTIAL_ENCRYPTION_KEY: "${GEOIP_CREDENTIAL_ENCRYPTION_KEY:-}"
      GEOIP_UPDATE_ENABLED: "${GEOIP_UPDATE_ENABLED:-true}"
      GEOIP_UPDATE_INTERVAL: "${GEOIP_UPDATE_INTERVAL:-24h}"
      GEOIP_DATA_DIR: "${GEOIP_DATA_DIR:-data/geoip}"
      INTERNAL_SERVICE_SECRET: "${INTERNAL_SERVICE_SECRET:-local-dev-secret}"
      # Job Service gateway
      JOB_SERVICE_ENABLED: "${JOB_SERVICE_ENABLED:-true}"
      JOB_SERVICE_INTERNAL_URL: "${JOB_SERVICE_INTERNAL_URL:-http://job-service:19191}"
      JOB_SERVICE_AUTH_MODE: "${JOB_SERVICE_AUTH_MODE:-bearer}"
      JOB_SERVICE_BEARER_TOKEN: "${JOB_SERVICE_BEARER_TOKEN:-${JOB_SERVICE_INTERNAL_BEARER_TOKEN:-${INTERNAL_SERVICE_SECRET:-local-dev-secret}}}"
      # Local dev control-plane URL used by Backend to call the bundled NodeAgent.
      NODEAGENT_CONTROL_URL: "${NODEAGENT_CONTROL_URL:-http://nodeagent:9100}"
      NODEAGENT_CONTROL_NODE_NAME: "${NODEAGENT_CONTROL_NODE_NAME:-local-nodeagent}"
      NODEAGENT_CONTROL_TOKEN: "${NODEAGENT_CONTROL_TOKEN:-dev-nodeagent-control-token-change-me}"
      GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"
      GOCACHE: /workspace/.cache/go-build
      GOMODCACHE: /workspace/.cache/go/pkg/mod
      PATH: /usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "${LIVEMASK_BACKEND_HTTP_PORT:-18080}:8080"
      - "${LIVEMASK_BACKEND_NODEAGENT_TLS_PORT:-18084}:${NODEAGENT_BACKEND_TLS_PORT:-8443}"
    volumes:
      - ${LIVEMASK_WORKSPACE_ROOT:-/Users/sammytan/Developer/LiveMask}/livemask-backend:/workspace/livemask-backend
      - livemask-local-go-cache:/workspace/.cache
      - livemask-local-backend-geoip:/workspace/livemask-backend/data/geoip
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    image: ${ADMIN_NODE_IMAGE:-node:22-alpine}
    profiles: ["admin"]
    working_dir: /workspace/livemask-admin
    restart: unless-stopped
    command: ["sh", "-lc", "npm install --no-audit --no-fund || (rm -rf node_modules && npm install --no-audit --no-fund); npm run dev -- --hostname 0.0.0.0 --port 3000"]
    environment:
      # Local Admin mirrors the dev environment by default so dashboard pages
      # show real dev data. Override BACKEND_INTERNAL_URL for backend-local work.
      BACKEND_INTERNAL_URL: "${BACKEND_INTERNAL_URL:-https://api.livemask-vpn.com}"
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "${WATCHPACK_POLLING:-true}"
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-true}"
    ports:
      - "${LIVEMASK_ADMIN_PORT:-3001}:3000"
    volumes:
      - ${LIVEMASK_WORKSPACE_ROOT:-/Users/sammytan/Developer/LiveMask}/livemask-admin:/workspace/livemask-admin
      - livemask-local-admin-node-modules:/workspace/livemask-admin/node_modules
      - livemask-local-admin-next:/workspace/livemask-admin/.next

  website:
    image: ${WEBSITE_NODE_IMAGE:-node:22-alpine}
    profiles: ["website"]
    working_dir: /workspace/livemask-website
    restart: unless-stopped
    command: ["sh", "-lc", "npm install --no-audit --no-fund || (rm -rf node_modules && npm install --no-audit --no-fund); npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      # Browser API calls and Vite dev proxy both default to the public API.
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-https://api.livemask-vpn.com}"
      VITE_PROXY_TARGET: "${VITE_PROXY_TARGET:-https://api.livemask-vpn.com}"
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-true}"
    ports:
      - "${LIVEMASK_WEBSITE_PORT:-3002}:5173"
    volumes:
      - ${LIVEMASK_WORKSPACE_ROOT:-/Users/sammytan/Developer/LiveMask}/livemask-website:/workspace/livemask-website
      - livemask-local-website-node-modules:/workspace/livemask-website/node_modules

  nodeagent:
    image: ${NODEAGENT_GO_IMAGE:-golang:1.26-alpine}
    profiles: ["nodeagent"]
    working_dir: /workspace/livemask-nodeagent
    restart: unless-stopped
    command: ["sh", "-lc", "apk add --no-cache openssl >/dev/null 2>&1 || true; sh /workspace/livemask-nodeagent/scripts/install-singbox.sh /usr/local/bin && sh /workspace/livemask-nodeagent/scripts/ensure-dev-hy2-tls.sh && /usr/local/go/bin/go run ./cmd/nodeagent"]
    environment:
      BACKEND_BASE_URL: "${BACKEND_BASE_URL:-https://backend:${NODEAGENT_BACKEND_TLS_PORT:-8443}}"
      BACKEND_CONFIG_URL: "${BACKEND_CONFIG_URL:-https://backend:${NODEAGENT_BACKEND_TLS_PORT:-8443}/internal/agent/config}"
      NODE_COUNTRY_CODE: "${NODE_COUNTRY_CODE:-US}"
      IDENTITY_PATH: /workspace/.state/identity.json
      AGENT_VERSION: "${AGENT_VERSION:-dev-local}"
      CONFIG_CACHE_PATH: /workspace/.state/nodeagent-config-cache.json
      LISTEN_ADDR: ":9100"
      NODEAGENT_CONTROL_TOKEN: "${NODEAGENT_CONTROL_TOKEN:-dev-nodeagent-control-token-change-me}"
      POLL_INTERVAL_SEC: "${POLL_INTERVAL_SEC:-30}"
      SPEEDTEST_DOWNLOAD_URL: "${SPEEDTEST_DOWNLOAD_URL:-}"
      LOG_UPLOAD_ENABLED: "${LOG_UPLOAD_ENABLED:-true}"
      GEOIP_ENABLED: "${GEOIP_ENABLED:-true}"
      GEOIP_PROFILE: "${GEOIP_PROFILE:-country}"
      GEOIP_FORMAT: "${GEOIP_FORMAT:-maxmind-mmdb}"
      NODEAGENT_GEOIP_PROFILE: "${NODEAGENT_GEOIP_PROFILE:-country}"
      NODEAGENT_GEOIP_FORMAT: "${NODEAGENT_GEOIP_FORMAT:-maxmind-mmdb}"
      GEOIP_CHECK_INTERVAL_SEC: "${GEOIP_CHECK_INTERVAL_SEC:-300}"
      SINGBOX_REMOTE_UPDATE_ENABLED: "${SINGBOX_REMOTE_UPDATE_ENABLED:-true}"
      SINGBOX_COMPONENT_DIR: "${SINGBOX_COMPONENT_DIR:-/workspace/.state/singbox-components}"
      SINGBOX_CACHE_BIN: "${SINGBOX_CACHE_BIN:-/workspace/.singbox-cache/sing-box}"
      SINGBOX_RUNTIME_CACHE_BIN: "${SINGBOX_RUNTIME_CACHE_BIN:-/workspace/.state/sing-box}"
      SINGBOX_MANIFEST_PLATFORM: "${SINGBOX_MANIFEST_PLATFORM:-linux-amd64-musl}"
      SINGBOX_MANIFEST_ARCH: "${SINGBOX_MANIFEST_ARCH:-amd64}"
      SINGBOX_MANIFEST_POLL_INTERVAL_SEC: "${SINGBOX_MANIFEST_POLL_INTERVAL_SEC:-300}"
      # LAN dev: bind sing-box on all interfaces so phones on the same Wi‑Fi can reach the proxy port.
      SINGBOX_LISTEN_HOST: "${SINGBOX_LISTEN_HOST:-0.0.0.0}"
      SINGBOX_TRANSPORT: "${SINGBOX_TRANSPORT:-udp}"
      SINGBOX_PROTOCOL_PROFILE: "${SINGBOX_PROTOCOL_PROFILE:-hysteria2}"
      # Required when protocol_profile=hysteria2 (static fallback auth; per-session auth layered on top).
      HYSTERIA2_AUTH: "${HYSTERIA2_AUTH:-local-dev-hy2-auth}"
      NODEAGENT_TLS_CERT_PATH: "${NODEAGENT_TLS_CERT_PATH:-/workspace/.state/dev-hy2-tls/cert.pem}"
      NODEAGENT_TLS_KEY_PATH: "${NODEAGENT_TLS_KEY_PATH:-/workspace/.state/dev-hy2-tls/key.pem}"
      GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"
      GOCACHE: /workspace/.cache/go-build
      GOMODCACHE: /workspace/.cache/go/pkg/mod
      PATH: /usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "${LIVEMASK_NODEAGENT_PORT:-19090}:9100"
      - "${SINGBOX_PUBLIC_ENDPOINT_PORT_START:-65001}-${SINGBOX_PUBLIC_ENDPOINT_PORT_END:-65535}:${SINGBOX_LISTEN_PORT_START:-65001}-${SINGBOX_LISTEN_PORT_END:-65535}/tcp"
      - "${SINGBOX_PUBLIC_ENDPOINT_PORT_START:-65001}-${SINGBOX_PUBLIC_ENDPOINT_PORT_END:-65535}:${SINGBOX_LISTEN_PORT_START:-65001}-${SINGBOX_LISTEN_PORT_END:-65535}/udp"
    volumes:
      - ${LIVEMASK_WORKSPACE_ROOT:-/Users/sammytan/Developer/LiveMask}/livemask-nodeagent:/workspace/livemask-nodeagent
      - ${LIVEMASK_WORKSPACE_ROOT:-/Users/sammytan/Developer/LiveMask}/livemask-ci-cd/infra/_build_deps/nodeagent/bin:/workspace/.singbox-cache:ro
      - livemask-local-nodeagent-state:/workspace/.state
      - livemask-local-go-cache:/workspace/.cache
    depends_on:
      - backend

  job-service:
    image: ${JOB_SERVICE_GO_IMAGE:-golang:1.25-alpine}
    profiles: ["job-service"]
    working_dir: /workspace/livemask-job-service
    restart: unless-stopped
    command: ["sh", "-lc", "/usr/local/go/bin/go run -tags sqlstore ./cmd/job-service"]
    environment:
      JOB_SERVICE_CONFIG: "/workspace/livemask-job-service/configs/job-service.local.json"
      PORT: "19191"
      DB_DSN: "${JOB_SERVICE_DB_DSN:-postgres://${POSTGRES_USER:-livemask}:${POSTGRES_PASSWORD:-livemask}@postgres:5432/${POSTGRES_DB:-livemask}?sslmode=disable}"
      JOB_SERVICE_MODE: "${JOB_SERVICE_MODE:-local}"
      REDIS_ADDR: "redis:6379"
      JOB_SERVICE_REDIS_ENABLED: "true"
      JOB_SERVICE_INTERNAL_AUTH_ENABLED: "${JOB_SERVICE_INTERNAL_AUTH_ENABLED:-true}"
      JOB_SERVICE_INTERNAL_AUTH_MODE: "${JOB_SERVICE_INTERNAL_AUTH_MODE:-bearer}"
      JOB_SERVICE_INTERNAL_BEARER_TOKEN: "${JOB_SERVICE_INTERNAL_BEARER_TOKEN:-${INTERNAL_SERVICE_SECRET:-local-dev-secret}}"
      BACKEND_INTERNAL_URL: "http://backend:8080"
      BACKEND_INTERNAL_SECRET: "${BACKEND_INTERNAL_SECRET:-local-dev-secret}"
      GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"
      GOCACHE: /workspace/.cache/go-build
      GOMODCACHE: /workspace/.cache/go/pkg/mod
      PATH: /usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "${LIVEMASK_JOB_SERVICE_PORT:-19191}:19191"
    volumes:
      - ${LIVEMASK_WORKSPACE_ROOT:-/Users/sammytan/Developer/LiveMask}/livemask-job-service:/workspace/livemask-job-service
      - livemask-local-go-cache:/workspace/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  livemask-local-postgres:
  livemask-local-backend-geoip:
  livemask-local-go-cache:
  livemask-local-admin-node-modules:
  livemask-local-admin-next:
  livemask-local-website-node-modules:
  livemask-local-nodeagent-state:
