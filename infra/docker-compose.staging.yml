name: ${LIVEMASK_STACK_NAME:-livemask-dev}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livemask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livemask}
      POSTGRES_DB: ${POSTGRES_DB:-livemask}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-livemask}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - livemask-dev

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - livemask-dev

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "${LIVEMASK_BACKEND_HTTP_PORT:-64003}:8080"
    environment:
      PORT: "8080"
      DB_DSN: "${DB_DSN:-postgres://${POSTGRES_USER:-livemask}:${POSTGRES_PASSWORD:-livemask}@host.docker.internal:${POSTGRES_PORT:-15432}/${POSTGRES_DB:-livemask}?sslmode=disable}"
      REDIS_ADDR: "${REDIS_ADDR:-host.docker.internal:${REDIS_PORT:-16379}}"
      VERSION: "${BACKEND_VERSION:-0.0.0}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-key-do-not-use-in-production-32chr}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://admin.livemask-vpn.com,https://www.livemask-vpn.com,https://livemask-vpn.com,http://127.0.0.1:${LIVEMASK_ADMIN_PORT:-64001},http://127.0.0.1:${LIVEMASK_WEBSITE_PORT:-64000}}"
      PUBLIC_PRIMARY_DOMAIN: "${PUBLIC_PRIMARY_DOMAIN:-}"
      # GeoIP credential encryption (dev-only; production uses a real key)
      GEOIP_CREDENTIAL_ENCRYPTION_KEY: "${GEOIP_CREDENTIAL_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      GEOIP_UPDATE_ENABLED: "${GEOIP_UPDATE_ENABLED:-true}"
      GEOIP_UPDATE_INTERVAL: "${GEOIP_UPDATE_INTERVAL:-24h}"
      GEOIP_DATA_DIR: "${GEOIP_DATA_DIR:-data/geoip}"
      INTERNAL_SERVICE_SECRET: "${INTERNAL_SERVICE_SECRET:-local-dev-secret}"
      # Job Service admin gateway (dev runtime)
      JOB_SERVICE_ENABLED: "${JOB_SERVICE_ENABLED:-true}"
      JOB_SERVICE_INTERNAL_URL: "${JOB_SERVICE_INTERNAL_URL:-http://host.docker.internal:${LIVEMASK_JOB_SERVICE_PORT:-64002}}"
      JOB_SERVICE_AUTH_MODE: "${JOB_SERVICE_AUTH_MODE:-none}"
      JOB_SERVICE_TIMEOUT_SEC: "${JOB_SERVICE_TIMEOUT_SEC:-30}"
      NODEAGENT_CONTROL_URL: "${NODEAGENT_CONTROL_URL:-http://host.docker.internal:${LIVEMASK_NODEAGENT_PORT:-65000}}"
      NODEAGENT_CONTROL_NODE_NAME: "${NODEAGENT_CONTROL_NODE_NAME:-local-nodeagent}"
      # Sponsor install bundle rendering (P2)
      PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-${STAGING_PUBLIC_API_BASE_URL:-https://api.livemask-vpn.com}}"
      NODEAGENT_IMAGE: "${NODEAGENT_IMAGE:-ghcr.io/myaidevs/livemask-nodeagent:dev}"
      NODEAGENT_DEFAULT_VERSION: "${NODEAGENT_DEFAULT_VERSION:-${NODEAGENT_VERSION:-dev}}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - livemask-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        BACKEND_INTERNAL_URL: "${BACKEND_INTERNAL_URL:-http://host.docker.internal:${LIVEMASK_BACKEND_HTTP_PORT:-64003}}"
    restart: unless-stopped
    ports:
      - "${LIVEMASK_ADMIN_PORT:-64001}:3000"
    environment:
      BACKEND_INTERNAL_URL: "${BACKEND_INTERNAL_URL:-http://host.docker.internal:${LIVEMASK_BACKEND_HTTP_PORT:-64003}}"
      NEXT_TELEMETRY_DISABLED: "1"
    networks:
      - livemask-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"

  website:
    build:
      context: .
      dockerfile: Dockerfile.website
      args:
        VITE_API_BASE_URL: "${PUBLIC_API_BASE_URL:-${STAGING_PUBLIC_API_BASE_URL:-https://api.livemask-vpn.com}}"
    restart: unless-stopped
    ports:
      - "${LIVEMASK_WEBSITE_PORT:-64000}:3000"
    networks:
      - livemask-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nodeagent:
    build:
      context: .
      dockerfile: Dockerfile.nodeagent
    restart: unless-stopped
    ports:
      - "${LIVEMASK_NODEAGENT_PORT:-65000}:${LIVEMASK_NODEAGENT_SERVICE_PORT:-65000}/tcp"
      - "${SINGBOX_PUBLIC_ENDPOINT_PORT_START:-65001}-${SINGBOX_PUBLIC_ENDPOINT_PORT_END:-65535}:${SINGBOX_LISTEN_PORT_START:-65001}-${SINGBOX_LISTEN_PORT_END:-65535}/tcp"
      - "${SINGBOX_PUBLIC_ENDPOINT_PORT_START:-65001}-${SINGBOX_PUBLIC_ENDPOINT_PORT_END:-65535}:${SINGBOX_LISTEN_PORT_START:-65001}-${SINGBOX_LISTEN_PORT_END:-65535}/udp"
    environment:
      BACKEND_BASE_URL: "${NODEAGENT_BACKEND_BASE_URL:-http://host.docker.internal:${LIVEMASK_BACKEND_HTTP_PORT:-64003}}"
      NODEAGENT_BACKEND_URL: "${NODEAGENT_BACKEND_BASE_URL:-http://host.docker.internal:${LIVEMASK_BACKEND_HTTP_PORT:-64003}}"
      BACKEND_CONFIG_URL: "${NODEAGENT_BACKEND_CONFIG_URL:-http://host.docker.internal:${LIVEMASK_BACKEND_HTTP_PORT:-64003}/internal/agent/config}"
      NODE_COUNTRY_CODE: "${NODE_COUNTRY_CODE:-US}"
      IDENTITY_PATH: /var/lib/livemask-nodeagent/identity.json
      CREDENTIAL_PATH: /var/lib/livemask-nodeagent/credentials.json
      AGENT_VERSION: "${NODEAGENT_VERSION:-dev}"
      CONFIG_CACHE_PATH: /var/lib/livemask-nodeagent/runtime_config.json
      LISTEN_ADDR: ":${LIVEMASK_NODEAGENT_SERVICE_PORT:-65000}"
      NODEAGENT_PORT: "${LIVEMASK_NODEAGENT_SERVICE_PORT:-65000}"
      POLL_INTERVAL_SEC: "${POLL_INTERVAL_SEC:-30}"
      LOG_UPLOAD_ENABLED: "${LOG_UPLOAD_ENABLED:-true}"
      GEOIP_ENABLED: "${GEOIP_ENABLED:-true}"
      GEOIP_PROFILE: "${GEOIP_PROFILE:-country}"
      GEOIP_FORMAT: "${GEOIP_FORMAT:-geoip2-cn-mmdb}"
      NODEAGENT_GEOIP_PROFILE: "${NODEAGENT_GEOIP_PROFILE:-country}"
      NODEAGENT_GEOIP_FORMAT: "${NODEAGENT_GEOIP_FORMAT:-geoip2-cn-mmdb}"
      GEOIP_CHECK_INTERVAL_SEC: "${GEOIP_CHECK_INTERVAL_SEC:-300}"
      SINGBOX_PUBLIC_ENDPOINT_HOST: "${SINGBOX_PUBLIC_ENDPOINT_HOST:-}"
      NODEAGENT_TLS_CERT_PATH: "${NODEAGENT_TLS_CERT_PATH:-}"
      NODEAGENT_TLS_KEY_PATH: "${NODEAGENT_TLS_KEY_PATH:-}"
      NODE_PUBLIC_HOST_V6: "${NODE_PUBLIC_HOST_V6:-}"
      # Dev HY2 server auth (required when protocol template has no secret_refs)
      HYSTERIA2_AUTH: "${HYSTERIA2_AUTH:-}"
      NODEAGENT_HYSTERIA2_AUTH: "${NODEAGENT_HYSTERIA2_AUTH:-${HYSTERIA2_AUTH:-}}"
    volumes:
      - livemask-dev-nodeagent:/var/lib/livemask-nodeagent
      - ${HY2_TLS_CERT_DIR:-/etc/letsencrypt/live/livemask-vpn.com}:/etc/livemask/hy2-tls:ro
    networks:
      - livemask-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"

  job-service:
    build:
      context: .
      dockerfile: Dockerfile.jobservice
    restart: unless-stopped
    ports:
      - "${LIVEMASK_JOB_SERVICE_PORT:-64002}:64002"
    environment:
      JOB_SERVICE_CONFIG: "/etc/livemask/job-service.json"
      PORT: "64002"
      DB_DSN: "${JOB_SERVICE_DB_DSN:-${DB_DSN:-postgres://${POSTGRES_USER:-livemask}:${POSTGRES_PASSWORD:-livemask}@host.docker.internal:${POSTGRES_PORT:-15432}/${POSTGRES_DB:-livemask}?sslmode=disable}}"
      JOB_SERVICE_MODE: "dev"
      REDIS_ADDR: "${JOB_SERVICE_REDIS_ADDR:-${REDIS_ADDR:-host.docker.internal:${REDIS_PORT:-16379}}}"
      JOB_SERVICE_REDIS_ENABLED: "true"
      JOB_SERVICE_INTERNAL_AUTH_ENABLED: "${JOB_SERVICE_INTERNAL_AUTH_ENABLED:-false}"
      BACKEND_INTERNAL_URL: "${BACKEND_INTERNAL_URL:-http://host.docker.internal:${LIVEMASK_BACKEND_HTTP_PORT:-64003}}"
      BACKEND_SERVICE_AUTH_MODE: "${BACKEND_SERVICE_AUTH_MODE:-internal_secret}"
      BACKEND_INTERNAL_SECRET: "${BACKEND_INTERNAL_SECRET:-${INTERNAL_SERVICE_SECRET:-local-dev-secret}}"
    networks:
      - livemask-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  livemask-dev:
    driver: bridge

volumes:
  livemask-dev-nodeagent:
